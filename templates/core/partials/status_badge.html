{% if status == 'PUBLISHED' %}<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1 text-[10px] font-extrabold uppercase tracking-wider text-emerald-700"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Publié</span>{% elif status == 'CONFIRMED' %}<span class="inline-flex items-center gap-1.5 rounded-full bg-blue-50 px-3 py-1 text-[10px] font-extrabold uppercase tracking-wider text-blue-700"><span class="h-1.5 w-1.5 rounded-full bg-blue-500"></span>Confirmé</span>{% elif status == 'PROPOSED' %}<span class="inline-flex items-center gap-1.5 rounded-full bg-amber-50 px-3 py-1 text-[10px] font-extrabold uppercase tracking-wider text-amber-700"><span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>Proposé</span>{% else %}<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1 text-[10px] font-extrabold uppercase tracking-wider text-slate-600"><span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>Brouillon</span>{% endif %}
